/**:
  ros__parameters:
    # Recommended split models:
    #   kinematic_noslip_noimu_direct_speed : no IMU/KF, /drive.speed setpoint
    #   slip_kinematic_with_imu_direct_speed: IMU/KF supplies vy; signed IMU supplies yaw-rate
    #   dynamic_imu_recursive        : IMU initializes ax/ay; future ax/ay are recursively predicted
    # kinematic_residual은 아래 binary GRU checkpoint를 CUDA rollout 안에서 실행한다.
    # Keep the controller rollout identical to the simulator plant. The MLP
    # residual produced a persistent yaw-rate bias in closed-loop simulation.
    dynamics_model: dynamic_mlp_residual_servo_lag
    residual_weights_path: config/kinematic_residual_gru.bin
    kinematic_noslip_noimu_weights_path: config/ifac0807_strict_noslip_noimu_16d.bin
    slip_kinematic_with_imu_weights_path: config/slip_kinmatic_MLP.bin
    dynamic_imu_weights_path: config/ifac2026_dynamic_imu_recursive.bin
    dynamic_mlp_weights_path: config/dynamic_MLP_ackermann_previous_steer.bin
    dynamic_mlp_servo_lag_weights_path: /home/a/smooth-mppi-cuda/config/dynamic_40ms_residual_servo_lag.bin
    dynamic_mlp_vx_delta_weights_path: /home/a/smooth-mppi-cuda/config/dynamic_40ms_vx_delta_history_24d.bin
    effective_history_weights_path: config/effective_history_state_residual.bin
    e2e_weights_path: config/E2E.bin
    # IMU is causally aligned to odometry and is also used by the 2-state vy KF.
    imu_topic: /imu/data
    imu_sync_max_age_s: 0.05
    imu_ema_alpha: 0.25
    # 0807 raw IMU is FRD; convert at the subscriber boundary to MPPI FLU.
    imu_wz_sign: 1.0
    imu_ax_sign: 1.0
    imu_ay_sign: 1.0
    require_imu_for_mlp: true  # do not run an IMU-trained MLP with fallback placeholders
    lateral_velocity_kf_enabled: false  # dynamic_imu_recursive selects the KF automatically
    # Linear-tire cornering stiffness [N/rad]. These are NOT the Pacejka C shape factors.
    # 0807 collision-cleaned bag, recursive-KF rollout regression result.
    kf_cornering_stiffness_front: 11.8634884
    kf_cornering_stiffness_rear: 58.0473264
    kf_min_vx: 0.5
    kf_low_speed_threshold: 0.5  # CUDA rollout: below 0.5 m/s force vy=0
    kf_max_abs_vy: 2.0
    kf_q_vy: 0.03372753
    kf_q_yaw_rate: 0.02
    kf_r_lateral_accel: 0.3960560
    kf_r_yaw_rate: 0.01
    kf_initial_p_vy: 0.25
    kf_initial_p_yaw_rate: 0.10
    kf_reset_gap_s: 0.5
    # +1 assumes sensor_msgs/Imu.linear_acceleration.y is vehicle body +Y (left).
    # Set -1 only if the installed IMU's +Y axis points to vehicle right.
    imu_lateral_accel_sign: 1.0
    # Adaptive oversteer handling: blend linear-bicycle prediction toward
    # causal IMU d(vy)/dt = ay-vx*yaw_rate when lateral dynamics become nonlinear.
    kf_nonlinear_dvy_threshold: 2.3911474
    kf_nonlinear_dvy_width: 1.5530068
    kf_nonlinear_inertial_blend: 0.6382294
    kf_nonlinear_process_noise_scale: 7.4273267
    kf_nonlinear_ay_noise_scale: 4.0024465
    # Must match model_tuning_utils/lateral_velocity_kf.py::estimate_dataset.
    kf_steer_scale: 1.1058064699
    kf_steer_bias: -0.0300696939
    kf_max_steer: 0.4788
    # --- Limits ---
    max_steer: 0.4788        # rad
    min_accel: -1.0          # m/s^2
    max_accel: 1.0           # m/s^2
    min_speed: 0.5
    max_speed: 3.5  # fastest validated Map1 setting
    # Racing-line 자유도를 위해 중앙선 오차 기반 publish 속도 제한은 사용하지 않는다.
    heading_speed_limit_gain: 0.0
    contour_speed_limit_gain: 0.0

    # --- Costs (최적화 결과 반영) ---
    q_v: 12.0
    q_dist: 0.0             # legacy Euclidean path cost (MPCC에서는 0 유지)
    q_contour: 0.0          # 중앙선 고정 대신 track boundary 안에서 racing line 허용
    q_lag: 0.0              # 중앙선 접선방향 위치 오차는 랩타임 목적에 사용하지 않음
    q_heading: 1.0          # 역주행/불안정 억제를 위한 약한 방향 regularization만 유지
    q_error_speed: 0.0      # 중앙선 오차에 따른 속도 억제 비활성화
    q_du: 0.12
    q_steer: 0.30
    q_collision: 5000.0
    q_lat_g: 60.0
    lat_g_soft_limit: 9.5                 # soft combined-grip ceiling
    longitudinal_accel_soft_limit: 4.0    # friction ellipse ax axis [m/s^2]
    # Rear-slip soft constraint: q * max(0, |alpha_r|-limit)^2.
    # alpha_r = -atan2(vy-l_r*yaw_rate, |vx|). It complements the GG ellipse
    # by detecting rear-axle saturation while total ax/ay is still moderate.
    q_rear_slip: 800.0
    rear_slip_soft_limit_deg: 8.0
    rear_slip_cost_min_speed: 1.5         # disable ill-conditioned low-vx slip cost
    # MPC-style lane-boundary slack:
    # s_k=max(0, collision_radius-min_boundary_clearance), cost=q_s*s_k^2.
    # Boundary violation remains finite/selectable; only physical obstacles
    # retain post-rollout hard candidate rejection.
    collision_radius: 0.40
    q_boundary_slack: 15000.0
    q_boundary_terminal_slack: 15000.0
    # true: reject an off-track weighted-control rollout and use the
    # lowest-cost safe sampled sequence. false: publish standard MPPI weighted
    # controls without this post-optimization replacement.
    weighted_trajectory_safety_enabled: true
    q_progress: 85.0        # simulation lap-time tuning
    q_escape_vel: 28.0      # horizon 말단의 전진속도 보상
    horizon_steps: 60       # model_dt=0.04 s 기준 2.4 s prediction horizon
    # --- Obstacle Avoidance Params ---
    obstacle_avoidance_enabled: true
    # Simulation supplies one opponent as global odometry. Real-car perception
    # supplies up to MAX_OBS global detections using f1_msgs/F1stateArr.
    simulation_obstacle_odom_topic: /opp_racecar/odom
    real_perception_obstacles_topic: /f1/perception/object/obstacles/arr
    real_perception_obstacles_frame: map
    obstacle_timeout: 0.5
    car_radius: 0.25             # conservative combined footprint radius
    obstacle_influence_distance: 0.9
    # Temporary emergency exploration only when a previously absent/moved
    # obstacle first appears near the vehicle. Normal obstacle planning keeps
    # using obstacle_influence_distance and has no forced deceleration.
    sudden_obstacle_replan_enabled: true
    sudden_obstacle_jump_threshold: 0.75 # 새로 나타난 것으로 볼 위치 변화량
    sudden_obstacle_replan_distance: 3.0 # 긴급 모드를 켤 최대 차량 거리
    sudden_obstacle_replan_duration: 1.0 # 긴급 모드를 유지할 시간
    sudden_obstacle_influence_distance: 2.0 # rollout cost에 장애물 비용을 적용하기 시작하는 거리 (기존 obstacle_influence_distance 대신)
    # Cost target includes model/rectangular-footprint margin, while candidate
    # acceptance remains at the actual measured clearance requirement.
    sudden_obstacle_min_clearance: 0.70 # 긴급 모드의 비용상 목표 안전거리
    sudden_obstacle_candidate_clearance: 0.68 # 실제 실행 candidate를 허용하는 최소 예측 거리
    sudden_obstacle_cost_multiplier: 3.0
    q_obs: 650.0
    
    # --- Noise & Tuning ---
    noise_steer_std: 0.35    # rad/s
    noise_accel_std: 2.0     # m/s^3
    max_steer_rate: 50.0    # rad/s
    # Input slew rate: m/s^2 for direct-speed models, m/s^3 for acceleration-command models.
    max_accel_rate: 4.0
    lambda: 20.0
    num_samples: 3200        # desktop simulation: ~4 ms measured
    visualize_candidates: true
    control_rate_hz: 50.0    # 20 ms timer; MPPI 계산도 이 주기보다 짧아야 함
    model_dt: 0.04  # lag/effective rollout knot; ROS solve/publish remains 50 Hz
    # effective_history_state_residual training contract. These describe the
    # joint command-to-state response, not a measured physical servo.
    effective_steer_scale: 0.51
    effective_steer_bias: 0.01
    effective_yaw_response_tau: 0.10
    effective_max_yaw_accel: 15.0
    effective_speed_response_gain: 0.76
    effective_max_accel: 1.0
    effective_vy_decay_tau: 0.12
    
    # --- Dynamic Model Params (Pacejka & Kinematics) ---
    mass: 3.74
    l_f: 0.163
    l_r: 0.161
    # tiv_imu_bagdisjoint_kinematic_classic 식별 결과. l_f/l_r/mass는 학습 시 고정값.
    kinematic_steer_scale: 0.50927964
    kinematic_steer_bias: 0.01015773
    # Robust 1.6 s fit: /odom speed units -> /newmcl_pose map displacement.
    kinematic_position_speed_scale: 0.8633491306389823
    kinematic_no_slip: true               # residual checkpoint 학습 조건(beta=0)
    speed_servo_kp: 0.7616888694734905
    # r_kin=vx*tan(delta)/L is a target, not an instantaneous yaw-rate assignment.
    kinematic_yaw_rate_time_constant: 0.1
    kinematic_max_yaw_accel: 15.0
    steer_servo_time_constant: 0.15514851356820727
    actuator_max_steer_rate: 0.8344090950084138
    # all6_seed31 검증 조합: 1.2 s yaw-rate MAE/p95가 회귀 후보보다 우수함.
    speed_reference_accel_time_constant: 0.04
    speed_reference_brake_time_constant: 0.02
    actuator_max_speed_reference_rate: 8.0
    I_z: 0.04712
    Cm0: 0.04                # 고속 감쇠용 모터 역기전력 계수
    
    # Pacejka 4-파라미터 (ForzaETH On-Track-SysID 규약)
    #   F_y = F_z * D * sin( C * atan( B*a - E*(B*a - atan(B*a)) ) )
    # D 는 **무차원 마찰계수**이고, 힘의 크기는 정하중이 만든다 —
    # 노드가 F_zf = m*g*l_r/l_wb = 18.2315 N, F_zr = m*g*l_f/l_wb = 18.4579 N 로 계산한다.
    #
    # 아래 값은 예전 3-파라미터(D 가 뉴턴 단위) 설정의 **무손실 변환**이다:
    #   D_f: 38.0 N / 18.2315 N = 2.0843,  D_r: 35.5 N / 18.4579 N = 1.9233,  E = 0
    # E=0 이면 수식이 예전 형태로 정확히 환원되므로 주행 거동은 바뀌지 않는다.
    #
    # 주의: 이 값을 마찰계수로 읽으면 mu ~ 2.08 로 물리적으로 불가능하다 (실제 타이어는 0.6~1.0).
    # pacejka_sysid 로 식별한 D 는 훨씬 작게 나오며, 그대로 넣으면 횡력이 3~4배 줄어
    # SMPPI 가 크게 보수적으로 변한다. 반드시 저속에서 단계적으로 적용할 것.
    # 절차: src/control/pacejka_sysid/README.md 의 "식별 결과를 SMPPI 에 반영하기" 참고.
    B_f: 6.0926
    C_f: 1.2447
    D_f: 0.7955
    E_f: 0.7815
    B_r: 6.6457
    C_r: 2.2129
    D_r: 0.7317
    E_r: 0.0597

    # 0807 dynamic regression; used only by dynamic_mlp_residual.
    dynamic_mlp_B_f: 2.9844349007584565
    dynamic_mlp_C_f: 1.3
    dynamic_mlp_D_f: 0.362611229414815
    dynamic_mlp_E_f: 0.0
    dynamic_mlp_B_r: 0.3173165891873783
    dynamic_mlp_C_r: 1.3
    dynamic_mlp_D_r: 2.799999941680244
    dynamic_mlp_E_r: 0.0
    dynamic_mlp_I_z: 0.04712
    dynamic_mlp_min_speed: 0.8 # runtime low-speed kinematic yaw fallback / residual gate

    # --- Runtime environment and topics ---
    # true : simulator pose + twist come from simulation_odom_topic
    # false: real_pose_topic supplies map pose and real_odom_topic supplies velocity
    is_simulation: true
    simulation_odom_topic: /ego_racecar/odom
    simulation_drive_topic: /drive  # must match f1tenth_gym_ros sim.yaml ego_drive_topic
    real_pose_topic: /newmcl_pose
    real_odom_topic: /odom
    real_drive_topic: /drive
    path_topic: /mppi_target_path
