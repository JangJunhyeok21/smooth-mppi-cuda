/**:
  ros__parameters:
    # --- Limits ---
    max_steer: 0.47        # rad
    min_accel: -8.0          # m/s^2
    max_accel: 8.5           # m/s^2
    min_speed: 0.5           # m/s
    max_speed: 10.0           # m/s

    # --- Costs (최적화 결과 반영) ---
    q_v: 1.3
    q_dist: 0.0
    q_du: 0.2
    q_steer: 0.3
    q_collision: 300.0
    q_lat_g: 100.0
    lat_g_threshold: 4.2        # 횡가속도 소프트 페널티 시작 임계값 [m/s^2]
    lat_g_fault_threshold: 6.0  # 횡가속도 하드 페일 임계값 [m/s^2]
    collision_radius: 0.25
    boundary_margin: 0.05       # collision_radius에 더해지는 소프트 페널티 시작 여유거리 [m]
    boundary_soft_gain: 40.0    # 소프트 페널티 이차항 계수
    q_progress: 16.0  #36.0
    q_escape_vel: 12.0  #32.0
    
    # --- Obstacle Avoidance Params ---
    car_radius: 0.2
    q_obs: 50.0
    
    # --- Noise & Tuning ---
    noise_steer_std: 0.4     # rad/s
    noise_accel_std: 2.0     # m/s^3
    max_steer_rate: 3.5      # rad/s
    max_accel_rate: 100.0    # m/s^3
    lambda: 100.0
    visualize_candidates: true
    
    # --- Dynamic Model Params (Pacejka & Kinematics) ---
    mass: 3.74
    l_f: 0.163
    l_r: 0.161
    I_z: 0.04712
    Cm0: 0.04                # 고속 감쇠용 모터 역기전력 계수

    # --- Vehicle Footprint (Multi-Circle Collision Check) ---
    # base_link(후륜축) 기준으로 차체를 N개의 원으로 근사해 충돌 체크의 기하학적 정확도를 높인다.
    # 아래 값은 플레이스홀더 추정치이며 실측값으로 반드시 교체할 것.
    vehicle_length: 0.50       # 범퍼~범퍼 전장 [m]
    vehicle_width: 0.30        # 전폭 [m]
    wheelbase: 0.324           # 기본값은 l_f+l_r과 동일; 필요 시 실측값으로 override
    # rear_overhang / front_overhang은 생략 시 (vehicle_length-wheelbase)/2 로 자동 계산됨
    num_circles: 3
    circle_safety_margin: 1.05 # circle_radius = vehicle_width/2 * 이 값

    # Pacejka 4-파라미터 (ForzaETH On-Track-SysID 규약)
    #   F_y = F_z * D * sin( C * atan( B*a - E*(B*a - atan(B*a)) ) )
    # D 는 **무차원 마찰계수**이고, 힘의 크기는 정하중이 만든다 —
    # 노드가 F_zf = m*g*l_r/l_wb = 18.2315 N, F_zr = m*g*l_f/l_wb = 18.4579 N 로 계산한다.
    #
    # 아래 값은 예전 3-파라미터(D 가 뉴턴 단위) 설정의 **무손실 변환**이다:
    #   D_f: 38.0 N / 18.2315 N = 2.0843,  D_r: 35.5 N / 18.4579 N = 1.9233,  E = 0
    # E=0 이면 수식이 예전 형태로 정확히 환원되므로 주행 거동은 바뀌지 않는다.
    #
    # 주의: 이 값을 마찰계수로 읽으면 mu ~ 2.08 로 물리적으로 불가능하다 (실제 타이어는 0.6~1.0).
    # pacejka_sysid 로 식별한 D 는 훨씬 작게 나오며, 그대로 넣으면 횡력이 3~4배 줄어
    # SMPPI 가 크게 보수적으로 변한다. 반드시 저속에서 단계적으로 적용할 것.
    # 절차: src/control/pacejka_sysid/README.md 의 "식별 결과를 SMPPI 에 반영하기" 참고.
    B_f: 6.7722
    C_f: 1.4462
    D_f: 0.445
    E_f: 0.561

    B_r: 8.0358
    C_r: 2.0762
    D_r: 0.4161
    E_r: 0.7044

    # --- Topics (공통 키) ---
    odom_topic: /odom0
    pose_topic: /mcl_pose
    velocity_topic: /odom
    drive_topic: /drive
    path_topic: /mppi_target_path
    use_mcl_pose: false      # 시뮬레이터 구동 모드

    # --- Overtake FSM: 상대차 인지 ---
    f1_obstacles_topic: /f1/perception/object/obstacles/arr  # f1_msgs/F1stateArr (perception 노드 발행)
    obstacle_timeout_s: 0.5   # 이 시간 넘게 갱신 없으면 미검출로 처리 (메시지 stamp가 없어 수신시각 기준)
    opp_min_speed: 0.5        # 이 속도 이상인 트랙만 "상대차"(추월 대상)로 간주, 그 미만은 정적 장애물 취급
    fsm_side_pred_time: 0.6   # 여유폭 계산 시 상대 횡위치 예측 시간 [s]

    # --- Overtake FSM: 상태 전이/속도 파라미터 ---
    fsm_follow_dist: 0.8        # FOLLOW 진입 거리 [m]
    fsm_prep_dist: 0.5          # OVERTAKE_PREP 진입 거리 [m]
    fsm_clear_dist: 1.0         # SOLO 복귀 거리 [m]
    fsm_merge_dist: 1.2         # 추월 완료 판정 거리 [m]
    fsm_prep_timeout_s: 2.5     # PREP 최대 체류 시간 [s]
    fsm_emergency_dist: 0.5     # EMERGENCY 트리거 거리 [m]
    fsm_clear_threshold: 0.8    # 추월 가능 판정 여유폭 [m]
    fsm_lateral_offset: 0.5     # 바이패스 경로 횡방향 오프셋 [m]
    fsm_side_confirm_ticks: 3   # 방향 확정 전 연속 확인 틱 수
    fsm_side_switch_margin: 0.2 # 선호 방향 교체 히스테리시스 [m]
    fsm_abort_clear_factor: 0.5 # 추월 중단 임계 = clear_threshold * factor
    fsm_solo_speed: 6.0         # SOLO/MERGE 목표 속도 [m/s]
    fsm_follow_speed: 4.5       # FOLLOW/PREP 목표 속도 [m/s]
    fsm_overtake_speed: 6.5     # OVERTAKE 목표 속도 [m/s]
    fsm_emergency_speed: 0.0    # EMERGENCY 목표 속도 [m/s]