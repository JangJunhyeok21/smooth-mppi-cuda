dynamic_obstacle_predictor:
  ros__parameters:
    # Input selection: simulation | perception | both
    input_mode: perception
    simulation_odom_topic: /opp_racecar/odom
    perception_topic: /f1/perception/object/obstacles/arr
    # Apply Gaussian localization noise to dynamic-object x/y inputs. The
    # sampled error is clipped independently per axis to +/- 0.10 m, matching
    # the pose-noise augmentation used to train the deployed MDN.
    input_pose_noise_std_m: 0.05
    input_pose_noise_max_m: 0.10
    input_pose_noise_seed: 20260824
    # RViz Publish Point (/clicked_point) becomes a temporary static circular
    # obstacle. Each click adds a new obstacle (up to
    # max_clicked_point_static_obstacles, oldest evicted first) with its own
    # lifetime.
    enable_clicked_point_static_obstacle: true
    clicked_point_topic: /clicked_point
    clicked_point_static_obstacle_lifetime_s: 20.0
    max_clicked_point_static_obstacles: 4

    output_topic: /mppi/dynamic_obstacle_trajectory
    marker_topic: /mppi/dynamic_obstacle_prediction_markers
    publish_rate_hz: 50.0
    # MPPI consumes the 50 Hz trajectory, not the RViz markers.  Publish and
    # sample visualization separately to avoid serialization dominating time.
    publish_markers: true
    marker_publish_rate_hz: 20.0
    marker_horizon_stride: 4

    # 72-D speed-aware contract:
    # history 6 * [delta_s, d, v, kappa, left, right, delta_t]
    # + lookahead 10 * [kappa, left, right].
    include_speed_feature: false
    # The predictor selects exactly one path from include_speed_feature.
    # Relative paths are resolved from the package share directory.
    use_speed_model_path: config/predictor/dynamic_obstacle_frenet_speed_mdn_ifac2026_pose_noise/frenet_mdn.onnx
    no_speed_model_path: config/predictor/dynamic_obstacle_frenet_mdn_ifac2026_pose_noise/frenet_mdn.onnx
    track_csv: data/track_20260814/track_20260814_mppi_track_optimal.csv

    # The MDN weights are trained per track (see the metadata.json beside each
    # model: data_dir is a simulator MPPI run on one specific track). On
    # track_20260814 the ifac2026 weights are worse than assuming the obstacle
    # is frozen -- median error at the 2.4 s horizon over 238 rollout windows on
    # four bags: MDN 5.67 m, frozen 3.72 m, constant velocity along the raceline
    # 2.75 m. So run constant velocity here until this track has its own weights.
    # Set false on a track whose weights exist (ifac2026: MDN 2.67 m beats
    # constant velocity 2.76 m).
    constant_velocity_prediction: true
    # Per-step sigma of the random walk that grows the ellipse in that mode,
    # chosen to reproduce the measured 2.75 m error at 2.4 s. maximum_radius
    # caps the ellipse long before the horizon, so this mostly decides how fast
    # it reaches that cap.
    constant_velocity_sigma_step_m: 0.355

    # |v| <= threshold: fixed-pose circular ellipse. |v| > threshold: MDN.
    # Must equal the controller's max_obstacles (params.yaml): smppi_node rejects
    # a whole trajectory message carrying more than that.
    max_obstacles: 15
    dynamic_speed_threshold: 1.0
    # Static obstacle ellipse semi-major == semi-minor == this radius.
    static_car_radius: 0.6
    opponent_radius: 0.45
    maximum_radius: 0.75
    longitudinal_ellipse_gain: 5.1
    lateral_ellipse_gain: 1.1
