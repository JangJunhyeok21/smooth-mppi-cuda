/**:
  ros__parameters:
    # --- Limits ---
    max_steer: 0.4788        # rad
    min_accel: -8.0          # m/s^2
    max_accel: 8.5           # m/s^2
    min_speed: 0.5           # m/s
    max_speed: 5.0           # m/s

    # --- Costs (최적화 결과 반영) ---
    q_v: 1.3
    q_dist: 0.0
    q_du: 0.2
    q_steer: 0.3
    q_collision: 300.0
    q_lat_g: 100.0
    # use_curvature_grip=true 일 때는 "코너에서 쓸 수 있는 횡가속도" 의미가 되어
    # 속도 한계 v_lim = sqrt(lat_g_threshold/|kappa|) 를 정한다. 모델 상한이 7.38 이므로
    # 그 아래에서 고른다. 실측 A/B(map1): 5.5 는 너무 보수적(거리 95m), 7.0 이 최적
    # (거리 114m = base 수준인데 이탈 0%). false 일 때는 기존대로 |s.ay| 임계값.
    lat_g_threshold: 7.0        # 횡가속도 소프트 페널티 시작 임계값 [m/s^2]
    # 하드 페일 임계값 [m/s^2]. 타이어 모델이 낼 수 있는 최대 횡가속도는
    #   (F_zf*D_f + F_zr*D_r)/mass = 7.38 m/s^2
    # 이므로 이 값이 7.38 이상이면 영원히 발동하지 않는다 (예전 9.0 은 dead code 였다).
    # 파세이카 D 를 바꾸면 이 상한도 같이 바뀌니 docs/verify_diagnosis.py 로 재확인할 것.
    lat_g_fault_threshold: 7.0
    collision_radius: 0.25
    q_progress: 16.0  #36.0
    q_escape_vel: 12.0  #32.0
    q_impact: 300.0    # 충돌 시 v^2 페널티. 전 샘플 fault 시 "느리게 박기"를 유도

    # ── Phase 3 (2026-08-04 시뮬 A/B, 조건당 6회 검증) ────────────────────
    # [3-C] 트랙 전폭 barrier: q_barrier * (e_y/half_width)^6
    #   q_dist=0 이면 횡방향으로 비용이 평평해 최적해가 "벽 페널티가 막 켜지는 지점"에
    #   딱 붙고 robustness margin 이 0 이 된다. 이 항이 최적해를 제약면에서 떼어놓는다.
    #   |e_norm|<0.8 에서 사실상 0 이라 레이싱 라인 자유도는 그대로 유지된다.
    #   실측(map1, 60s×6회): 이탈 36.2%→14.2% (t=-2.31 유의), 거리 117→146m,
    #                        시행간 표준편차 27.2→16.8m 로 재현성도 크게 개선.
    #   ⚠ 5000 으로 올리면 오히려 나빠진다(이탈 24.3%, std 30.9) — 너무 세면
    #     센터라인으로 밀어붙여 빠른 라인을 못 쓴다. 2000 근방이 최적.
    q_barrier: 2000.0
    # [3-B] 그립 페널티 지표를 "달성값 s.ay"(타이어 상한 7.38에서 포화 → 그 위로는
    #   속도가 공짜) 대신 "곡률이 정하는 속도 한계 v_lim=sqrt(lat_g_threshold/|kappa|)"로.
    #   이게 지금까지 비용함수에 없던 "코너 앞에서 감속하라" 항이다.
    #   실측: 6회 전부 이탈 0.0%, 시행간 표준편차 2.7m (base 27.2m) — 재현성 10배.
    use_curvature_grip: true
    fault_accel: -2.0  # fault 이후 유지할 감속 [m/s^2] (감속만 하는 정책은 의도된 동작)
    boundary_margin: 0.05  # 소프트 페널티 시작 여유거리 [m] (기본 0.35 → barrier 도입 후 축소)

    # --- Obstacle Avoidance Params ---
    car_radius: 0.25
    q_obs: 150.0
    
    # --- Noise & Tuning ---
    # 노이즈는 조향 "증분"에 들어가므로(× dt) 한 스텝이 움직일 수 있는 폭이
    # noise_steer_std * dt 로 제한된다. 0.4 이면 t=0 탐색 폭이 0.38deg 에 불과해
    # 8000 샘플이 사실상 전부 이전 계획의 미세 변형이 되고, 회피 기동이 후보 집합에
    # 아예 존재하지 않는다 (docs/smppi-diagnosis-2026-08.md C-1).
    # 목표: t=0 에서 max_steer 의 5%(0.024 rad) 이상 → noise_steer_std ≈ 1.5
    # 다만 실차 조향 떨림에 직결되므로 0.4 → 0.6 → 1.0 → 1.5 로 단계적으로 올리며
    # /drive 의 steering_angle 을 rosbag 으로 확인할 것. IIR 워밍업(mppi_core.cu)이
    # 선행되어야 이 값을 올린 효과가 초반 스텝에 실제로 반영된다.
    noise_steer_std: 0.4     # rad/s
    noise_accel_std: 2.0     # m/s^3
    max_steer_rate: 8.0      # rad/s
    max_accel_rate: 100.0    # m/s^3
    lambda: 200.0  # ESS 진단(compute_optimal_control) 실측 근거 λ~400-700 방향으로 상향; 추가 미세조정 필요
    visualize_candidates: true
    
    # --- Dynamic Model Params (Pacejka & Kinematics) ---
    mass: 3.74
    l_f: 0.163
    l_r: 0.161
    I_z: 0.04712
    Cm0: 0.04                # 고속 감쇠용 모터 역기전력 계수
    
    # Pacejka 4-파라미터 (ForzaETH On-Track-SysID 규약)
    #   F_y = F_z * D * sin( C * atan( B*a - E*(B*a - atan(B*a)) ) )
    # D 는 **무차원 마찰계수**이고, 힘의 크기는 정하중이 만든다 —
    # 노드가 F_zf = m*g*l_r/l_wb = 18.2315 N, F_zr = m*g*l_f/l_wb = 18.4579 N 로 계산한다.
    #
    # 아래 값은 예전 3-파라미터(D 가 뉴턴 단위) 설정의 **무손실 변환**이다:
    #   D_f: 38.0 N / 18.2315 N = 2.0843,  D_r: 35.5 N / 18.4579 N = 1.9233,  E = 0
    # E=0 이면 수식이 예전 형태로 정확히 환원되므로 주행 거동은 바뀌지 않는다.
    #
    # 주의: 이 값을 마찰계수로 읽으면 mu ~ 2.08 로 물리적으로 불가능하다 (실제 타이어는 0.6~1.0).
    # pacejka_sysid 로 식별한 D 는 훨씬 작게 나오며, 그대로 넣으면 횡력이 3~4배 줄어
    # SMPPI 가 크게 보수적으로 변한다. 반드시 저속에서 단계적으로 적용할 것.
    # 절차: src/control/pacejka_sysid/README.md 의 "식별 결과를 SMPPI 에 반영하기" 참고.
    B_f: 6.0926
    C_f: 1.2447
    D_f: 0.7955
    E_f: 0.7815

    B_r: 6.6457
    C_r: 2.2129
    D_r: 0.7317
    E_r: 0.0597

    # 저속(kinematic) ↔ 고속(Pacejka dynamic) tanh 블렌딩 전이 구간
    # sigma = 0.5*(1+tanh((v-v_blend_center)/v_blend_width))
    v_blend_center: 1.5
    v_blend_width: 0.5

    # --- Topics (공통 키) ---
    odom_topic: /odom0
    pose_topic: /mcl_pose
    velocity_topic: /odom
    drive_topic: /drive
    path_topic: /mppi_target_path
    use_mcl_pose: false      # 시뮬레이터 구동 모드

    # --- Overtake FSM: 상대차 인지 ---
    f1_obstacles_topic: /f1/perception/object/obstacles/arr  # f1_msgs/F1stateArr (perception 노드 발행)
    obstacle_timeout_s: 0.5   # 이 시간 넘게 갱신 없으면 미검출로 처리 (메시지 stamp가 없어 수신시각 기준)
    opp_min_speed: 0.5        # 이 속도 이상인 트랙만 "상대차"(추월 대상)로 간주, 그 미만은 정적 장애물 취급
    fsm_side_pred_time: 0.6   # 여유폭 계산 시 상대 횡위치 예측 시간 [s]

    # --- Overtake FSM: 상태 전이/속도 파라미터 ---
    fsm_follow_dist: 5.0        # FOLLOW 진입 거리 [m]
    fsm_prep_dist: 3.5          # OVERTAKE_PREP 진입 거리 [m]
    fsm_clear_dist: 7.0         # SOLO 복귀 거리 [m]
    fsm_merge_dist: 2.0         # 추월 완료 판정 거리 [m]
    fsm_prep_timeout_s: 2.5     # PREP 최대 체류 시간 [s]
    fsm_emergency_dist: 0.5     # EMERGENCY 트리거 거리 [m]
    fsm_clear_threshold: 0.8    # 추월 가능 판정 여유폭 [m]
    fsm_lateral_offset: 0.5     # 바이패스 경로 횡방향 오프셋 [m]
    fsm_side_confirm_ticks: 3   # 방향 확정 전 연속 확인 틱 수
    fsm_side_switch_margin: 0.2 # 선호 방향 교체 히스테리시스 [m]
    fsm_abort_clear_factor: 0.5 # 추월 중단 임계 = clear_threshold * factor
    fsm_solo_speed: 6.0         # SOLO/MERGE 목표 속도 [m/s]
    fsm_follow_speed: 4.5       # FOLLOW/PREP 목표 속도 [m/s]
    fsm_overtake_speed: 6.5     # OVERTAKE 목표 속도 [m/s]
    fsm_emergency_speed: 0.0    # EMERGENCY 목표 속도 [m/s]

