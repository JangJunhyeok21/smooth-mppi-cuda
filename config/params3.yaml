# IFAC2026 MPPI rank 3: rate8/slew15, 8 laps / 77.088185 s / 9.636 s per lap.
# This candidate completed 8 laps without collision but has not passed a 30-lap run.
/**:
  ros__parameters:
    # 사용 모델: dynamic_mlp_residual_servo_lag 또는 DYNAMIC_SERVO_LAG
    # MLP 모델만 아래 학습 가중치를 읽고, Classic 모델은 이 파일을 읽지 않는다.
    dynamics_model: DYNAMIC_SERVO_LAG
    dynamic_mlp_servo_lag_weights_path: config/dynamic_40ms_residual_servo_lag.bin
    # MLP 보정 출력만 제한한다. 센서값과 최종 state에는 적용하지 않는다.
    mlp_max_residual_ax: 0.0          # [m/s^2]
    mlp_max_residual_ay: 8.0          # [m/s^2]
    mlp_max_residual_yaw_accel: 12.0  # [rad/s^2]
    # IMU는 odom 시각에 causal 정렬되어 6-state MPPI classic-model EKF에 사용된다.
    imu_topic: /imu/data
    imu_sync_max_age_s: 0.05
    imu_ema_alpha: 0.25
    # 0807 raw IMU is FRD; convert at the subscriber boundary to MPPI FLU.
    imu_wz_sign: 1.0
    imu_ax_sign: 1.0
    imu_ay_sign: 1.0
    # 0817~0820 정지구간 robust median; FLU 변환 후 제거한다.
    imu_wz_bias: 0.0004
    imu_ax_bias: -0.17
    imu_ay_bias: 0.12
    # 6-state MPPI-model EKF. Order:
    # state/Q/P0 = [x, y, yaw, vx, vy, yaw_rate]
    # measurement/R = [MCL x, MCL y, MCL yaw, odom vx,
    #                  causal MCL vy, IMU yaw_rate, IMU ax, IMU ay]
    classic_kf_process_var: [0.00002, 0.00002, 0.00002, 0.003, 0.01, 0.003]
    classic_kf_measurement_var: [0.000225, 0.000225, 0.0001, 0.000625,
                                 0.0144, 0.0004, 0.1225, 0.1225]
    classic_kf_initial_var: [0.01, 0.01, 0.005, 0.03, 0.12, 0.02]
    # --- Limits ---
    max_steer: 0.4788        # rad
    # 현재 배포 모델의 학습 계약. ±4 후보는 tail 평가 미통과로 아직 배포하지 않는다.
    min_accel: -9.0          # m/s^2
    max_accel: 10.0          # permit the requested 10 m/s^2 longitudinal acceleration
    min_speed: 0.15
    max_speed: 10.0  # IFAC2026 30-lap candidate; simulator and MPPI use the same limit

    # --- Costs (최적화 결과 반영) ---
    q_v: 1.0 # vs 크기에 비례해서 
    q_dist: 5.0             # legacy Euclidean path cost (MPCC에서는 0 유지)
    q_contour: 0.0          # raceline is used as a progress reference, not a hard path
    q_lag: 0.0              # raceline 접선방향 오차는 최소한으로만 억제
    q_heading: 1.0          # weak direction regularization
    q_error_speed: 0.0     # preserve straight speed; reduce speed only while pose error grows
    q_du: 0.08             # rank-3 rate8/slew15 candidate
    q_steer: 0.0
    q_lat_g: 200.0 # strongly reject combined-grip excess without lowering max_speed
    lat_g_soft_limit: 8.5                 # soft combined-grip ceiling # DD-diagram ay max 제한
    longitudinal_accel_soft_limit: 10.0   # do not penalize requested straight-line ax <= 10 m/s^2
    # 전륜 slip soft constraint: applied steer를 사용한 alpha_f 비용
    q_front_slip: 300.0
    front_slip_soft_limit_deg: 12.0
    front_slip_cost_min_speed: 1.5
    # Rear-slip soft constraint: q * max(0, |alpha_r|-limit)^2.
    # alpha_r = -atan2(vy-l_r*yaw_rate, |vx|). It complements the GG ellipse
    # by detecting rear-axle saturation while total ax/ay is still moderate.
    q_rear_slip: 300.0
    rear_slip_soft_limit_deg: 12.0
    rear_slip_cost_min_speed: 1.5         # disable ill-conditioned low-vx slip cost
    # MPC-style lane-boundary slack:
    # s_k=max(0, collision_radius-min_boundary_clearance), cost=q_s*s_k^2.
    # Boundary violation remains finite/selectable; only physical obstacles
    # retain post-rollout hard candidate rejection.
    collision_radius: 0.3       # planning clearance; absorb model/servo mismatch before wall contact
    q_boundary_slack: 10000.0
    q_boundary_terminal_slack: 50000.0
    # LMPC와 같은 terminal safe set: 최근 2개 완주 lap에서 진행도 주변 20점씩 사용.
    # 목적함수 전환: mpcc=contour/progress, lmpc=terminal safe-set/cost-to-go.
    # 현재 2 m/s safe set은 느리므로 랩타임 주행 기본값은 mpcc이다.
    objective_mode: mpcc
    safe_set_file_path: config/safe_set/initial_safe_set_map1.csv
    safe_set_k_near: 20
    q_terminal_safe_set_slack: 1000.0  # terminal 상태와 convex safe set 사이 slack
    safe_set_cost_coefficient: 10.0    # 완주까지 남은 step(cost-to-go) 가중치
    safe_set_state_scale_x: 1.0        # x 오차 정규화 크기 [m]
    safe_set_state_scale_y: 1.0        # y 오차 정규화 크기 [m]
    safe_set_state_scale_yaw: 0.5      # yaw 오차 정규화 크기 [rad]
    q_progress: 110.0        # IFAC2026 30 laps: 267.45 s total, 8.915 s/lap
    q_escape_vel: 0.0      # horizon 말단의 전진속도 보상
    horizon_steps: 40       # 40 * model_dt(0.04 s) = 1.6 s prediction horizon
    # --- Obstacle Avoidance Params ---
    obstacle_avoidance_enabled: true
    # Separate predictor publishes obstacle-major poses at each 40 ms MPPI knot.
    dynamic_obstacle_prediction_enabled: true
    # false: ego avoids both static objects and predicted dynamic trajectories.
    predictor_static_obstacles_only: false
    dynamic_obstacle_trajectory_topic: /mppi/dynamic_obstacle_trajectory
    # MPPI receives obstacles exclusively from the separate predictor node.
    obstacle_timeout: 0.5
    # Predictor supplies each obstacle's own radius (semi_major/semi_minor);
    # ego's own footprint is not added to the clearance margin.
    max_obstacles: 7           # caps CUDA dynamic-obstacle buffers at solver construction
    obstacle_soft_margin: 0.0  # soft cost 시작 반경 = predictor obstacle radius + margin
    # s=max(0, obstacle_radius+margin-distance), cost=q_obs*s^2
    q_obs: 10000.0
    
    # --- Noise & Tuning ---
    noise_steer_std: 0.25    # rad/s
    noise_accel_std: 0.7     # IFAC2026 best stable speed-command exploration [m/s^2]
    max_steer_rate: 50.0    # rad/s
    # Input slew rate: m/s^2 for direct-speed models, m/s^3 for acceleration-command models.
    # Direct-speed command slew limit [m/s^2]. At the 50 Hz controller tick,
    # /drive.speed may therefore change by at most 10 * 0.02 = 0.20 m/s.
    max_accel_rate: 15.0
    lambda: 20.0
    num_samples: 1600        # desktop simulation: ~4 ms measured
    visualize_candidates: false # K*T 후보 복사 비활성화
    publish_visualization: true # 실차 MPPI 주기에서 MarkerArray 생성/직렬화 비활성화
    # false이면 /mppi_optimal_trajectory와 8개 cost 재계산을 모두 생략한다(대회 권장).
    publish_optimal_trajectory: true
    # path_publisher owns the slack-zero boundary MarkerArray; MPPI does not
    # duplicate this static visualization publisher.
    boundary_visualization_topic: /mppi_boundary_viz
    # path_publisher low-rate refresh; transient-local also serves late RViz.
    boundary_publish_period_s: 5.0
    control_rate_hz: 50.0    # 20 ms timer; MPPI 계산도 이 주기보다 짧아야 함
    model_dt: 0.04  # dynamic servo-lag rollout knot; ROS solve/publish remains 50 Hz
    
    # --- Dynamic Model Params (Pacejka & Kinematics) ---
    mass: 3.904
    l_f: 0.1833
    l_r: 0.1407
    # tiv_imu_bagdisjoint_kinematic_classic 식별 결과. l_f/l_r/mass는 학습 시 고정값.
    kinematic_steer_scale: 1.39621252  # Step 4 vehicle-response identification
    kinematic_steer_bias: -0.0237573549  # Step 4 vehicle-response identification
    kinematic_position_speed_scale: 1.0  # offline state is physical ground-relative body velocity
    kinematic_no_slip: true               # residual checkpoint 학습 조건(beta=0)
    # vx_cmd 추종 회귀값: 종방향 residual 없이 실제 바퀴속도 응답을 재현
    speed_servo_kp: 18.190463  # bag/session-disjoint vx rollout regression
    # r_kin=vx*tan(delta)/L is a target, not an instantaneous yaw-rate assignment.
    kinematic_yaw_rate_time_constant: 0.1
    kinematic_max_yaw_accel: 15.0
    steer_servo_time_constant: 0.197122435  # Step 4 vehicle-response identification
    # Servo specification: 60 deg / 0.16 s = 6.5449847 rad/s.
    actuator_max_steer_rate: 6.544984694978735 # 제조사 spec: 60 deg / 0.16 s = 6.5449847 rad/s
    # all6_seed31 검증 조합: 1.2 s yaw-rate MAE/p95가 회귀 후보보다 우수함.
    speed_reference_accel_time_constant: 0.0943852924  # bag/session-disjoint vx rollout regression
    speed_reference_brake_time_constant: 0.103878354  # bag/session-disjoint vx rollout regression
    actuator_max_speed_reference_rate: 8.0  # requested upper bound
    I_z: 0.04712
    Cm0: 0.04                # 고속 감쇠용 모터 역기전력 계수
    
    # Pacejka 4-파라미터 (ForzaETH On-Track-SysID 규약)
    #   F_y = F_z * D * sin( C * atan( B*a - E*(B*a - atan(B*a)) ) )
    # D 는 **무차원 마찰계수**이고, 힘의 크기는 정하중이 만든다 —
    # 노드가 F_zf = m*g*l_r/l_wb = 18.2315 N, F_zr = m*g*l_f/l_wb = 18.4579 N 로 계산한다.
    #
    # 아래 값은 예전 3-파라미터(D 가 뉴턴 단위) 설정의 **무손실 변환**이다:
    #   D_f: 38.0 N / 18.2315 N = 2.0843,  D_r: 35.5 N / 18.4579 N = 1.9233,  E = 0
    # E=0 이면 수식이 예전 형태로 정확히 환원되므로 주행 거동은 바뀌지 않는다.
    #
    # 주의: 이 값을 마찰계수로 읽으면 mu ~ 2.08 로 물리적으로 불가능하다 (실제 타이어는 0.6~1.0).
    # pacejka_sysid 로 식별한 D 는 훨씬 작게 나오며, 그대로 넣으면 횡력이 3~4배 줄어
    # SMPPI 가 크게 보수적으로 변한다. 반드시 저속에서 단계적으로 적용할 것.
    # 절차: src/control/pacejka_sysid/README.md 의 "식별 결과를 SMPPI 에 반영하기" 참고.
    B_f: 6.0926
    C_f: 1.2447
    D_f: 0.7955
    E_f: 0.7815
    B_r: 6.6457
    C_r: 2.2129
    D_r: 0.7317
    E_r: 0.0597

    # 0807 dynamic regression; used only by dynamic_mlp_residual.
    dynamic_mlp_B_f: 1.1059018
    dynamic_mlp_C_f: 1.41095005
    dynamic_mlp_D_f: 1.02235053
    dynamic_mlp_E_f: 0.0306089224
    dynamic_mlp_B_r: 3.02615957
    dynamic_mlp_C_r: 0.894503471
    dynamic_mlp_D_r: 1.1383197
    dynamic_mlp_E_r: 0.0832654531
    dynamic_mlp_I_z: 0.09059291359052173

    # --- Runtime environment and topics ---
    # Required CSV columns: x_m, y_m, w_tr_left_m, w_tr_right_m.
    # The MPPI track contains the centerline and left/right lane widths.
    # PathPublisher converts them to center/left/right paths.
    # Relative paths are resolved from the installed package share directory.
    # STEP3 track을 STEP4 minimum-curvature optimizer로 변환한 MPPI 산출물.
    csv_file_path: data/ifac2026/ifac2026_mppi_track_optimal.csv
    frame_id: map
    publish_rate: 0.2 # Hz
    # true : simulator pose + twist come from simulation_odom_topic
    # false: real_pose_topic supplies map pose and real_odom_topic supplies velocity
    is_simulation: true
    simulation_odom_topic: /ego_racecar/odom_noise
    simulation_drive_topic: /drive  # must match f1tenth_gym_ros sim.yaml ego_drive_topic
    real_pose_topic: /newmcl_pose
    real_odom_topic: /odom
    real_drive_topic: /drive
